[[evidence]]
id = "policy"
source = "가상 운영 정책"
status = "fact"
summary = "목요일 발송. KST 화요일 18시 이전에는 앱의 구독 관리에서 해당 회차 건너뛰기 또는 배송지 변경이 가능하다. 마감 후에는 운영자가 출고 상태를 확인하며 변경·취소를 보장하지 않는다. 결제 문의는 주문 번호로 확인하고 카드 전체 번호는 받지 않는다."

[[evidence]]
id = "case-1"
source = "가상 문의 1"
status = "fact"
summary = "수요일에 이번 주 배송을 건너뛰고 싶지만 앱에서 버튼이 보이지 않는다고 문의했다. 출고 여부는 기록에 없다."

[[evidence]]
id = "case-2"
source = "가상 문의 2"
status = "fact"
summary = "화요일 17시 40분 KST에 배송지를 변경할 메뉴가 어디인지 물었다. 변경 완료 여부는 확인되지 않았다."

[[evidence]]
id = "case-3"
source = "가상 문의 3"
status = "fact"
summary = "결제가 두 건처럼 보인다고 문의했다. 같은 주문인지, 승인·매입이 중복됐는지는 확인되지 않았다."

[[evidence]]
id = "case-4"
source = "가상 문의 4"
status = "fact"
summary = "화요일 18시 20분 KST에 배송지를 바꿨으나 이번 회차에 반영되는지 물었다. 저장된 주소와 출고 상태는 확인되지 않았다."
